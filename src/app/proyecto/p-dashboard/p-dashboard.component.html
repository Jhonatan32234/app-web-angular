<div class="flex flex-col p-6 justify-center items-center bg-gray-50 rounded-lg">
    <app-p-form [proyect]="editProyecto" (proyectoCreado)="agregarProyecto($event)" class="w-1/2"></app-p-form>
    <table class="w-full mt-6 text-center border-2 border-gray-400 text-lg">
        <thead class="bg-gray-100 text-gray-700">
        <tr>
            <th class="p-3 font-medium">Nombre</th>
            <th class="p-3 font-medium">Ubicacion</th>
            <th class="p-3 font-medium">Fecha de inicio</th>
            <th class="p-3 font-medium">Fecha de finalizacion</th>
            <th class="p-3 font-medium">Presupuesto</th>
            <th class="p-3 font-medium">Jefe asignado</th>
            <th class="p-3 font-medium">Editar</th>
            <th class="p-3 font-medium">Eliminar</th>
        </tr>
        </thead>
        <tr class="border-b border-gray-200 hover:bg-gray-50 text-lg" *ngFor="let proyect of proyects; let i = index">
            <td class="p-3">{{proyect.nombreproyecto}}</td>
            <td class="p-3">{{proyect.ubicacion}}</td>
            <td class="p-3">{{proyect.fechainicio}}</td>
            <td class="p-3">{{proyect.fechafinal}}</td>
            <td class="p-3">{{proyect.presupuesto}}</td>
            <td class="p-3">{{proyect.estadoproyecto}}</td>
            <td class="p-3">
                <button class="text-blue-600" (click)="editarProyectos(i)">Editar</button>
            </td>
            <td class="p-3">
                <button class="text-red-600" (click)="eliminarProyecto(i)">Eliminar</button>
            </td>
        </tr>
    </table>
</div>
