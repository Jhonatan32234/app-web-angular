<div class="flex flex-col p-6 justify-center items-center bg-gray-50 rounded-lg">
    <app-pa-form [proyectoAsignado]="editProyectoAs" (proyetoAsignadoCreado)="agregarProyectoAs($event)" class="w-1/2"></app-pa-form>
    <table class="w-full mt-6 text-center border-2 border-gray-400 text-lg">
        <thead class="bg-gray-100 text-gray-700">
        <tr >
            <th class="p-3 font-medium">Proyecto</th>
            <th  class="p-3 font-medium">Trabajador</th>
            <th  class="p-3 font-medium">Fecha asignada</th>
            <th  class="p-3 font-medium">Horas trabajadas</th>
            <th class="p-3 font-medium">Rol en el proyecto</th>
            <th  class="p-3 font-medium">Editar</th>
            <th  class="p-3 font-medium">Eliminar</th>
        </tr>
        </thead>
        <tr class="border-2 border-black" *ngFor="let pa of proyectAs;let i = index" class="border-b border-gray-200 hover:bg-gray-50 text-lg">
            <td class="p-3">{{pa.idproyecto}}</td>
            <td class="p-3">{{pa.idtrabajador}}</td>
            <td class="p-3">{{pa.fechaasignacion}}</td>
            <td class="p-3">{{pa.horastrabajadas}}</td>
            <td class="p-3">{{pa.rolproyecto}}</td>
            <td class="p-3">
                <button class="text-blue-600" (click)="editarProyectosAs(i)">Editar</button>
            </td>
            <td class="p-3">
                <button class="text-red-600" (click)="eliminarProyectoAs(i)">Eliminar</button>
            </td>
        </tr>
    </table>
</div>
