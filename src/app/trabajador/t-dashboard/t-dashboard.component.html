<div class="flex flex-col p-6 justify-center items-center bg-gray-50 rounded-lg">
    <app-t-form [workerE]="editTrabajador" (trabajadorCreado)="agregarTrabajador($event)" class="w-1/2"></app-t-form>
    <table class="w-full mt-6 text-center border-2 border-gray-400 text-lg">
        <thead class="bg-gray-100 text-gray-700">

        <tr>
            <th class="p-3 font-medium">Nombre</th>
            <th class="p-3 font-medium">Posicion</th>
            <th class="p-3 font-medium">Telefono</th>
            <th class="p-3 font-medium">Correo</th>
            <th class="p-3 font-medium">Salario</th>
            <th class="p-3 font-medium">Años de experiencia</th>
            <th class="p-3 font-medium">Editar</th>
            <th class="p-3 font-medium">Eliminar</th>
        </tr>
        </thead>
        <tr class="border-2 border-black" *ngFor="let trabajador of trabajadores; let i = index" class="border-b border-gray-200 hover:bg-gray-50 text-lg">
            <td class="p-3">{{trabajador.nombretrabajador}}</td>
            <td class="p-3">{{trabajador.posicion}}</td>
            <td class="p-3">{{trabajador.telefono}}</td>
            <td class="p-3">{{trabajador.correo}}</td>
            <td class="p-3">{{trabajador.salario}}</td>
            <td class="p-3">{{trabajador.aniosexperiencia}}</td>
            <td class="p-3">
                <button class="text-blue-600" (click)="editarTrabajador(i)">Editar</button>
            </td>
            <td class="p-3">
                <button class="text-red-600" (click)="eliminarTrabajador(i)">Eliminar</button>
            </td>
        </tr>
    </table>
</div>
